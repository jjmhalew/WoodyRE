# Builds WoodyRE.exe with build.bat (Windows), woodyre with build.sh (Linux, SDL2), the Android APK (android/, Gradle) and
# woodyre.nro with build_switch.sh (Switch homebrew) on every push and pull request (no game data involved: the programs
# hold only the port's own code). A pushed tag v* also publishes a GitHub release with WoodyRE-<tag>.zip (WoodyRE.exe,
# README.md, LICENSE), WoodyRE-<tag>-linux-x86_64.tar.gz (woodyre, README.md, LICENSE), WoodyRE-<tag>.apk and
# WoodyRE-<tag>-switch.zip (switch/woodyre/woodyre.nro, to unpack onto the SD card, README.md, LICENSE).
name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: cmd
        run: build.bat

      - name: Check the exe
        shell: pwsh
        run: |
          $v = (Get-Item WoodyRE.exe).VersionInfo
          "WoodyRE.exe: $((Get-Item WoodyRE.exe).Length) bytes, $($v.ProductName) $($v.FileVersion)"
          # a release tag must match res/woodyre.rc (the exe's and the APK's version): v1.2.3 = "1.2.3"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$($v.ProductVersion)") {
            "::error::tag $env:GITHUB_REF_NAME does not match the version in res/woodyre.rc ($($v.ProductVersion))"; exit 1 }

      - name: Package
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { "WoodyRE-$env:GITHUB_REF_NAME" } else { "WoodyRE-$($env:GITHUB_SHA.Substring(0, 7))" }
          New-Item -ItemType Directory -Force "pkg/$name" | Out-Null
          Copy-Item WoodyRE.exe, README.md, LICENSE "pkg/$name/"
          Compress-Archive -Path "pkg/$name" -DestinationPath "$name.zip"
          "ZIP=$name.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: WoodyRE-windows
          path: ${{ env.ZIP }}

  # Ubuntu 22.04: glibc 2.35 and SDL 2.0.20, so the binary also runs on older distributions and on SteamOS.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install SDL2
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev libgl-dev

      - name: Build
        run: sh build.sh woodyre && ls -l woodyre && ldd woodyre

      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then name="WoodyRE-$GITHUB_REF_NAME"; else name="WoodyRE-${GITHUB_SHA:0:7}"; fi
          mkdir -p "pkg/$name" && cp woodyre README.md LICENSE "pkg/$name/"
          tar -C pkg -czf "$name-linux-x86_64.tar.gz" "$name"
          echo "TGZ=$name-linux-x86_64.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: WoodyRE-linux
          path: ${{ env.TGZ }}

  # Android: arm64 phones and tablets, x86_64 for the emulator and Chromebooks. CMake fetches SDL 2.32.10; the runner's SDK
  # installs NDK 27.2 when it lacks it. Signed with the release key of the repository secrets ANDROID_KEYSTORE_B64 (the
  # keystore, base64), ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (store and key) when they are set. Without them the APK
  # carries the runner's debug key, which nobody keeps and which can differ from run to run: such an APK may not update the
  # one before it (Android wants the same key), and uninstalling first also deletes the copied game files and the saves.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/woody.jks"
            export ORG_GRADLE_PROJECT_woodyKeystore="$RUNNER_TEMP/woody.jks" ORG_GRADLE_PROJECT_woodyKeyAlias="$KEY_ALIAS" ORG_GRADLE_PROJECT_woodyKeyPassword="$KEY_PASSWORD"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::warning::no ANDROID_KEYSTORE_B64 secret: this release APK is signed with the runner's debug key and may not install over an earlier one"
          fi
          JAVA_HOME="$JAVA_HOME_17_X64" ./gradlew assembleRelease --console=plain

      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then name="WoodyRE-$GITHUB_REF_NAME"; else name="WoodyRE-${GITHUB_SHA:0:7}"; fi
          cp android/app/build/outputs/apk/release/app-release.apk "$name.apk" && ls -l "$name.apk"
          echo "APK=$name.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: WoodyRE-android
          path: ${{ env.APK }}

  # Nintendo Switch homebrew (.nro) in devkitPro's own image, which holds devkitA64, libnx, switch-sdl2 and switch-mesa.
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: sh build_switch.sh woodyre && ls -l woodyre.nro

      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then name="WoodyRE-$GITHUB_REF_NAME"; else name=$(printf 'WoodyRE-%.7s' "$GITHUB_SHA"); fi
          mkdir -p "pkg/switch/woodyre" && cp woodyre.nro "pkg/switch/woodyre/" && cp README.md LICENSE pkg/
          (cd pkg && zip -qr "../$name-switch.zip" .)
          echo "SWZIP=$name-switch.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: WoodyRE-switch
          path: ${{ env.SWZIP }}

  # The release notes: the annotated tag's message (what is new; its first line is the title of the tag), then how to start.
  release:
    if: github.ref_type == 'tag'
    needs: [windows, linux, android, switch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          new=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed -e 's/[[:space:]]*$//')
          start="Windows: unzip, start WoodyRE.exe and point it to your Woody Woodpecker CD (or a mounted ISO image of it). Linux / Steam Deck: unpack the .tar.gz and start woodyre (needs SDL2). Android: install the .apk and choose your ISO image or a copy of the CD at the first start. Switch (homebrew, experimental): unpack the -switch.zip onto the SD card and put your ISO image into /switch/woodyre/. The game files are not included - see README.md."
          if [ -n "$new" ]; then printf '%s\n\n%s\n' "$new" "$start" > notes.md; else printf '%s\n' "$start" > notes.md; fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "WoodyRE $GITHUB_REF_NAME" --notes-file notes.md
